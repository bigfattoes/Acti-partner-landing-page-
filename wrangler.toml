name = "activateme-partners"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Serves public/partner-form.js and public/partners.html.
[assets]
directory = "./public"

# Applications database. Cloudflare creates it ("activateme-partners-db") automatically on the
# first deploy. The /leads page also needs the LEADS_PASSWORD secret (dashboard -> this worker ->
# Settings -> Variables and Secrets -> Add -> type Secret).
[[d1_databases]]
binding = "DB"

# Spam protection: 10 requests a minute per IP on /apply and /leads.
[[ratelimits]]
name = "LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[vars]
# Sites allowed to send applications from a browser (this worker's own pages are always allowed).
ALLOWED_ORIGINS = "https://www.activatemefest.com,https://activatemefest.com,https://activateme.dev.mwancloud.com"

# Preview builds (branches other than main). No database, so previews show the page but don't save.
[previews]
[previews.vars]
ALLOWED_ORIGINS = "https://www.activatemefest.com,https://activatemefest.com,https://activateme.dev.mwancloud.com"

[[previews.ratelimits]]
name = "LIMITER"
namespace_id = "2002"
simple = { limit = 10, period = 60 }
